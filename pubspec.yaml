name: genlink_frontend

description: "This project for Genlink KH frontend design"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.0.1

  # ==============================
  # State Management + Routing + i18n
  # ==============================
  get: ^4.7.2

  # ==============================
  # UI Icons
  # ==============================
  cupertino_icons: ^1.0.8

  # ==============================
  # API Communication
  # ==============================
  dio: ^5.4.0

  # ==============================
  # Secure Local Storage
  # ==============================
  flutter_secure_storage: ^11.0.0

  # ==============================
  # Device Information
  # ==============================
  device_info_plus: ^13.2.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  photo_manager: ^3.12.0

  # ==============================
  # Media upload
  # ==============================
  crypto: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter recommended lint rules
  flutter_lints: ^6.0.0

  # Unit testing mock library
  mocktail: ^1.0.3

  # ==============================
  # App Launcher Icon
  # ==============================
  flutter_launcher_icons: ^0.14.4

# ==============================
# Flutter Launcher Icon Configuration
# ==============================
flutter_launcher_icons:
  android: true
  ios: true

  # Your application logo
  image_path: "assets/logos/genlink_icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/genlink_icon.png"

  # Remove alpha/transparency issues on Android
  android_gravity: center

  # iOS
  remove_alpha_ios: true

flutter:
  uses-material-design: true


  assets:

    - assets/icons/png/

    # Stickers
    - assets/stickers/cats/

    # Logos / Branding
    - assets/logos/

    # General Images
    - assets/images/

  # ==============================
  # Fonts
  # ==============================
  fonts:

    # Sora
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700

    # Kantumruy Pro
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/KantumruyPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/KantumruyPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700
