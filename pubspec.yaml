name: genlink_frontend
description: "This project for Genlink KH frontend design"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # GetX is the app-level routing, binding, and state management foundation.
  get: ^4.7.2

  cupertino_icons: ^1.0.8

  # HTTP client for API communication.
  dio: ^5.4.0

  # Encrypted storage for tokens and sensitive credentials.
  flutter_secure_storage: ^9.0.0

  # Device information for refresh token tracking.
  device_info_plus: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Mocking for tests.
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/svg/
    - assets/icons/png/
    - assets/logos/
    - assets/images/
    - assets/illustrations/
    - assets/lottie/
    - assets/backgrounds/auth/
    - assets/backgrounds/home/
    - assets/backgrounds/community/
    - assets/backgrounds/finance/
    - assets/backgrounds/productivity/
    - assets/backgrounds/growth/
    - assets/backgrounds/profile/
    - assets/textures/
