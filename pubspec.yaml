name: genlink_frontend

description: "This project for Genlink KH frontend design"

publish_to: 'none'

version: 1.0.0+1


environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  # ==============================
  # State Management + Routing + i18n
  # ==============================
  get: ^4.7.2

  # ==============================
  # UI Icons
  # ==============================
  cupertino_icons: ^1.0.8

  # ==============================
  # API Communication
  # ==============================
  dio: ^5.4.0

  # ==============================
  # Secure Local Storage
  # ==============================
  flutter_secure_storage: ^10.3.1

  # ==============================
  # Device Information
  # ==============================
  device_info_plus: ^13.2.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2

  # ==============================
  # Media upload
  # ==============================
  # SHA-256 of the file, sent at presign so the backend can record an integrity
  # checksum. Already present transitively; declared here because we use it
  # directly. Compression uses image_picker's built-in imageQuality/maxWidth,
  # so no extra native dependency is needed.
  crypto: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter recommended lint rules
  flutter_lints: ^6.0.0

  # Unit testing mock library
  mocktail: ^1.0.3


flutter:
  uses-material-design: true


  # ==============================
  # Assets
  # ==============================
  assets:

    # Icons
    - assets/icons/svg/
    - assets/icons/png/
    - assets/stickers/cats/

    # Logos / Branding
    - assets/logos/

    # General Images
    - assets/images/

    # Illustrations
    - assets/illustrations/

    # Lottie Animations
    - assets/lottie/

    # Backgrounds
    - assets/backgrounds/
    - assets/backgrounds/auth/
    - assets/backgrounds/home/
    - assets/backgrounds/community/
    - assets/backgrounds/finance/
    - assets/backgrounds/productivity/
    - assets/backgrounds/growth/
    - assets/backgrounds/profile/

    # Textures
    - assets/textures/

  # font
  fonts:

    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400

        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500

        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700


    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-Regular.ttf
          weight: 400

        - asset: assets/fonts/KantumruyPro-Medium.ttf
          weight: 500

        - asset: assets/fonts/KantumruyPro-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700
